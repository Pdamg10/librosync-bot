services:
  griffin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: griffin_librosync_bot
    restart: unless-stopped
    init: true
    env_file:
      - backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: sqlite+aiosqlite:////app/data/librosync.db
      STORAGE_DIR: /app/data/storage
      API_PORT: "8000"
    volumes:
      - librosync_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          urllib.request.urlopen('http://127.0.0.1:%s/' % os.getenv('API_PORT','8000'), timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  librosync_data:
