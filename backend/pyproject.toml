[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = true
files = [
    "app/core/config.py",
    "app/core/logging_config.py",
    "app/core/rate_limit.py",
    "app/bot/auth.py",
    "app/services/book_identity.py",
]
